const APP_KEY='antrenman_pro_v4';
const DEFAULT_WALKS={
 gun1:{warm:{speed:5,incline:3,min:7,km:0.58},finish:{speed:5.5,incline:9,min:15,km:1.38}},
 gun2:{warm:{speed:5,incline:3,min:7,km:0.58},finish:{speed:5.5,incline:7,min:15,km:1.38}}
};
let S=null,UI={view:'home',day:null,libEquip:'Tümü',libCat:'Tümü',q:'',openEx:null,editing:false,modal:null,summary:null};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function seed(){return {v:4,profile:{weight:96,height:181,age:34},routine:{gun1:clone(DEF.gun1),gun2:clone(DEF.gun2)},session:{date:today(),progress:{gun1:{},gun2:{}},weights:{gun1:{},gun2:{}},walks:clone(DEFAULT_WALKS)},history:[]}}
function migrate(){
 let old=null;try{old=JSON.parse(localStorage.getItem('antrenman_takip_v2')||'null')}catch(e){}
 if(old){const n=seed();n.profile=old.profile||n.profile;n.routine=old.routine||n.routine;n.history=(old.history||[]).map(h=>({...h,volume:h.volume||0}));return n}
 return seed()
}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(APP_KEY)||'null')}catch(e){};S=d&&d.v===4?d:migrate();if(!S.session||S.session.date!==today())newSession();if(!S.session.walks)S.session.walks=clone(DEFAULT_WALKS);save()}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(S))}catch(e){}}
function newSession(){S.session={date:today(),progress:{gun1:{},gun2:{}},weights:{gun1:{},gun2:{}},walks:clone(DEFAULT_WALKS)}}
function items(d){return S.routine[d]||[]}
function target(it){return it.type==='cardio'?1:(it.sets||3)}
function doneSets(d,id){return Math.min(S.session.progress[d][id]||0,target(items(d).find(x=>x.id===id)||{}))}
function last(d){return [...S.history].reverse().find(x=>x.day===d)}
function profile(){return S.profile}
function pct(d){let t=0,c=0;items(d).forEach(it=>{t+=target(it);c+=doneSets(d,it.id)});return t?Math.round(c/t*100):0}
function resistanceMinutes(it){return (it.type==='core'?1.5:2)}
function resistanceKcal(it,sets){return Math.round(sets*resistanceMinutes(it)*((it.met||4)*3.5*profile().weight/200))}
function walkMetrics(w){const speed=Math.max(0,Number(w.speed)||0),inc=Math.max(0,Number(w.incline)||0),min=Math.max(0,Number(w.min)||0);const spm=speed*1000/60,grade=inc/100;let vo2=.1*spm+1.8*spm*grade+3.5;if(speed>8)vo2=.2*spm+3.5;const met=Math.max(1,vo2/3.5);const kcal=min*met*3.5*profile().weight/200;const km=(Number(w.km)||0)>0?Number(w.km):(speed*min/60);return {met,kcal,km}}
function walkKcal(w){return Math.round(walkMetrics(w).kcal)}
function currentWalkTotal(d){const w=S.session.walks[d];return walkKcal(w.warm)+walkKcal(w.finish)}
function volume(d,id){const o=S.session.weights[d][id]||{};return Object.values(o).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0)}
function totalVolume(d){return items(d).filter(x=>x.type!=='cardio').reduce((a,it)=>a+volume(d,it.id),0)}
function currentKcal(d){let k=currentWalkTotal(d);items(d).forEach(it=>{if(it.type==='cardio')return;k+=resistanceKcal(it,doneSets(d,it.id))});return Math.round(k)}
function plannedWalk(d){const w=S.session.walks[d];return walkMetrics(w.warm).kcal+walkMetrics(w.finish).kcal}
function totalPlannedKcal(d){return Math.round(items(d).filter(it=>it.type!=='cardio').reduce((a,it)=>a+resistanceKcal(it,target(it)),0)+plannedWalk(d))}
function lastSet(d,id,i){const h=last(d);if(!h||!h.items)return null;const x=h.items.find(a=>a.id===id);return x&&x.sets&&x.sets[i]?x.sets[i]:null}

function ensure(d,id,i){if(!S.session.weights[d][id])S.session.weights[d][id]={};if(!S.session.weights[d][id][i])S.session.weights[d][id][i]={kg:'',reps:items(d).find(x=>x.id===id)?.reps||12,done:false};return S.session.weights[d][id][i]}
function setField(d,id,i,key,val){const s=ensure(d,id,i);s[key]=key==='kg'?String(val).replace(',','.'):Math.max(0,parseInt(val)||0);if(key==='reps'&&s.reps===0)s.reps=0;save();render()}
function toggleSet(d,id,i){const s=ensure(d,id,i);s.done=!s.done;let n=0;for(let j=0;j<(items(d).find(x=>x.id===id)?.sets||0);j++)if((S.session.weights[d][id]||{})[j]?.done)n++;S.session.progress[d][id]=n;save();render()}
function updateWalk(d,part,key,val){let w=S.session.walks[d][part];w[key]=Math.max(0,Number(String(val).replace(',','.'))||0);if(key!=='km'){w.km=+(w.speed*w.min/60).toFixed(2)}save();syncDayLive(d)}

 const k=currentKcal(d),v=Math.round(totalVolume(d)),p=pct(d);
 const q=(sel)=>root.querySelector(sel);
 q('.liveBigKcal')&&(q('.liveBigKcal').textContent=k); q('.liveKcal')&&(q('.liveKcal').textContent=k); q('.liveVol')&&(q('.liveVol').textContent=v); q('.livePct')&&(q('.livePct').textContent=p+'%'); q('.livePctTitle')&&(q('.livePctTitle').textContent='%'+p+' tamamlandı');
 q('.btnPrimary')&&(q('.btnPrimary').textContent='ANTRENMANI KAYDET · '+k+' KCAL');
 root.querySelectorAll('[data-walk]').forEach(inp=>{const part=inp.dataset.part;if(inp.dataset.k==='km'){const m=walkMetrics(S.session.walks[d][part]);if(document.activeElement!==inp)inp.value=m.km.toFixed(2)}});
 const cards=root.querySelectorAll('.walk'); cards.forEach((card,idx)=>{const part=idx===0?'warm':'finish';const kc=card.querySelector('.walkLiveKcal');if(kc)kc.textContent=Math.round(walkMetrics(S.session.walks[d][part]).kcal)+' kcal'});
 root.querySelectorAll('.exCard').forEach(card=>{const id=card.querySelector('[data-set]')?.dataset.id;if(id){const it=items(d).find(x=>x.id===id);const f=card.querySelector('.exFooter small');const l=card.querySelector('.load b');if(f)f.textContent=resistanceKcal(it,doneSets(d,id))+' kcal tahmini';if(l)l.textContent=Math.round(volume(d,id))+' kg·rep';}});
}
function render(){const a=document.getElementById('app');if(UI.modal==='settings'){a.innerHTML=home()+settings();return}if(UI.view==='home')a.innerHTML=home();else if(UI.view==='day')a.innerHTML=dayView(UI.day);else if(UI.view==='library')a.innerHTML=libView();else if(UI.view==='history')a.innerHTML=historyView();else a.innerHTML=summaryView();showInstallHint()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1900)}
function showInstallHint(){const c=document.getElementById('installCard');if(!c)return;const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;c.classList.toggle('show',!standalone)}
function copy(txt,msg){if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>fallback());else fallback();function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg)}}
function finish(d){const list=items(d).filter(it=>it.type!=='cardio');const h={date:new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'}),day:d,title:DAYMETA[d].title,pct:pct(d),kcal:currentKcal(d),volume:totalVolume(d),duration:Math.round(list.reduce((a,it)=>a+doneSets(d,it.id)*resistanceMinutes(it),0)+S.session.walks[d].warm.min+S.session.walks[d].finish.min),items:list.map(it=>({id:it.id,name:it.tr||it.name,sets:Array.from({length:it.sets},(_,i)=>({...ensure(d,it.id,i)})),volume:volume(d,it.id)})),walks:clone(S.session.walks[d])};S.history.push(h);UI.summary=h;newSession();save();UI.view='summary';UI.day=d;render()}
function toggleLib(d,lid){const arr=items(d),idx=arr.findIndex(x=>x.libId===lid||x.name===LIBFLAT.find(y=>y.id===lid)?.name);if(idx>=0){arr.splice(idx,1);toast('Programdan çıkarıldı')}else{const src=LIBFLAT.find(x=>x.id===lid);if(src){const cp=clone(src);cp.libId=src.id;cp.id='custom_'+Date.now().toString(36);arr.push(cp);toast('Programa eklendi')}}save();render()}
function backup(){copy(JSON.stringify(S),'Yedek kopyalandı')}
function restore(){try{const x=JSON.parse(document.getElementById('backupArea').value);if(!x||x.v!==4)throw 0;S=x;save();UI.modal=null;toast('Yedek geri yüklendi');render()}catch(e){toast('Yedek geçersiz')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;switch(act){case'home':UI.view='home';UI.modal=null;break;case'day':UI.view='day';UI.day=el.dataset.day;UI.editing=false;break;case'edit':UI.editing=!UI.editing;break;case'history':UI.view='history';UI.modal=null;break;case'library':UI.view='library';UI.modal=null;break;case'openEx':UI.openEx=UI.openEx===el.dataset.id?null:el.dataset.id;break;case'toggleSet':toggleSet(el.dataset.d,el.dataset.id,+el.dataset.i);break;case'finishDay':finish(el.dataset.day);break;case'resetSession':if(confirm('Bugünkü girişler silinsin mi?')){newSession();save();render()}break;case'libraryAdd':UI.view='library';break;case'libEquip':UI.libEquip=el.dataset.v;break;case'libCat':UI.libCat=el.dataset.v;break;case'toggleLib':toggleLib(el.dataset.day,el.dataset.id);return;case'settings':UI.modal='settings';break;case'closeModal':UI.modal=null;break;case'saveProfile':{S.profile.weight=Math.max(1,Number(document.getElementById('pWeight').value)||S.profile.weight);S.profile.height=Math.max(1,Number(document.getElementById('pHeight').value)||S.profile.height);S.profile.age=Math.max(1,Number(document.getElementById('pAge').value)||S.profile.age);save();UI.modal=null;toast('Profil kaydedildi');break}case'backup':backup();break;case'restore':restore();break;case'youtube':window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(el.dataset.name+' doğru form'),'_blank','noopener');return}render();window.scrollTo(0,0)});
document.addEventListener('input',e=>{if(e.target.id==='libSearch'){UI.q=e.target.value;render();const inp=document.getElementById('libSearch');if(inp){inp.focus();inp.setSelectionRange(UI.q.length,UI.q.length)}}if(e.target.matches('[data-set]')){const {d,id,i,k}=e.target.dataset;const s=ensure(d,id,+i);s[k]=k==='kg'?e.target.value.replace(',','.'):parseInt(e.target.value)||0;save();let c=e.target.closest('.exCard');if(c){const foot=c.querySelector('.exFooter small');if(foot){const it=items(d).find(x=>x.id===id);foot.textContent=resistanceKcal(it,doneSets(d,id))+' kcal tahmini'}const ld=c.querySelector('.load b');if(ld)ld.textContent=Math.round(volume(d,id))+' kg·rep'}}if(e.target.matches('[data-walk]')){updateWalk(e.target.dataset.d,e.target.dataset.part,e.target.dataset.k,e.target.value)}});
document.addEventListener('click',e=>{const row=e.target.closest('.exTitle');if(row){const c=row.closest('.exCard');const b=c?.querySelector('[data-act=openEx]');if(b){UI.openEx=UI.openEx===b.dataset.id?null:b.dataset.id;render()}}});
load();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
